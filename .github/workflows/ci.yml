name: CMMF Skills

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable reviewed npm
        run: |
          corepack enable npm
          corepack prepare npm@11.11.0 --activate
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Check tools and standalone skill packages
        run: npm run check

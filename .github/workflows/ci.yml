name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable reviewed npm
        run: corepack enable && corepack prepare npm@11.11.0 --activate
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency policy
        run: npm run deps:verify
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
